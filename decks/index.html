<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Deck Building · Branding Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-tokens.css">
<style>
*{box-sizing:border-box}button,input,select{font-family:inherit}html,body{background:#fff;color:#0a0a0a;margin:0}body{font:16px/1.55 Hind,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root{--t:#C1502E;--b:#05668D;--g:#0B6E4F;--s:#D4A017}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid #e5e5e5}.top{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.backhome{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border:2px solid #171717;color:#171717;text-decoration:none;font:700 15px/1 Khand,Hind,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.wm{font:700 22px/1 Khand,sans-serif;letter-spacing:.06em;min-height:44px;display:inline-flex;align-items:center}
.mini{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:1px solid #e5e5e5;transform:translateY(-100%);transition:transform .2s}.mini.on{transform:none}.mini .wrap{display:flex;align-items:center;gap:14px;height:44px}.mini a{color:#05668D;font:700 14px Khand,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;min-height:44px;display:flex;align-items:center}.mini b{font:700 18px Khand,sans-serif}
h1{font:700 48px/1 Khand,sans-serif;margin:24px 0 4px}.lead{color:#525252;margin:0 0 20px}
h2{font:700 26px/1.1 Khand,sans-serif;margin:28px 0 12px;display:flex;align-items:center;gap:10px}h2 .bar{width:6px;height:22px;background:var(--c)}
.bub{font:600 14px Hind;background:#f5f5f5;border-radius:999px;padding:2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:flex-start;border:1px solid #e5e5e5;border-left:4px solid var(--c);padding:14px;color:inherit;text-decoration:none;background:#fff;min-width:0}
.card .nm{font:700 20px/1.15 Khand,sans-serif}.card .sub{font-size:14px;color:#525252}.card .meta{font-size:13px;color:#737373;margin-top:4px}
.card .ic{width:22px;height:22px;flex:none;color:var(--c);margin-top:2px}.card>div{min-width:0;flex:1}
.tag{display:inline-block;font:700 12px Khand,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1.5px solid var(--c);color:var(--c);margin-top:6px}
.empty{color:#737373;border:1px dashed #d4d4d4;padding:16px}
.mw-hover{transition:transform 180ms ease-out,box-shadow 180ms ease-out}.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(10,10,10,.12)}
@media(hover:none){.mw-hover:hover{transform:none;box-shadow:none}}@media(prefers-reduced-motion:reduce){.mw-hover{transition:none}}
.sharerow{margin:36px 0 16px}.sharebtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border:2px solid #171717;background:#fff;color:#171717;font:700 16px Khand,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
footer{border-top:1px solid #e5e5e5;padding:18px 0;color:#737373;font-size:14px}
@media(min-width:1400px){.wrap{max-width:1560px}}
@media(max-width:480px){h1{font-size:38px}.grid{grid-template-columns:1fr}}
</style><script src="ptr.js?v=4" defer></script><script src="decks.js?v=7"></script></head><body>
<header><div class="wrap top"><a class="backhome mw-hover" href="https://webermanapps.github.io/a-o956qercs5ubd57y/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Apps Home</span></a><a class="wm" href="../" style="color:inherit;text-decoration:none">Branding Agent</a><span id="hdrUpd" style="margin-left:auto;font-size:13px;color:#525252">Updated …</span></div></header>
<div class="mini" id="mini" aria-hidden="true"><div class="wrap"><a href="https://webermanapps.github.io/a-o956qercs5ubd57y/" tabindex="-1">Apps Home</a><b>Branding Agent</b></div></div>
<main class="wrap">
<div id="deckApp" style="margin-top:10px"></div>
<div class="sharerow"><button class="sharebtn mw-hover" id="share" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>Share</button> <span id="msg" style="color:#525252;font-size:14px"></span></div>
</main>
<footer><div class="wrap"><b>Built by Max Weberman</b> · Branding Agent · Light Mode</div></footer>
<script>
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DeckApp(document.getElementById('deckApp'),{onData:J=>{hdrUpd.textContent='Updated '+new Date(J.updated).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'Asia/Bangkok'})+' ICT'},base:'../',self:'https://webermanapps.github.io/branding-djqmb410/decks/',apps:[{name:'Style Swipe',href:'https://webermanapps.github.io/style-swipe/',ic:'cards'},{name:'Branding',href:'../',ic:'check'},{name:'Apps Home',href:'https://webermanapps.github.io/a-o956qercs5ubd57y/',ic:'inbox'}]});
share.onclick=async()=>{const u=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:'Deck Building',url:u});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(u);msg.textContent='Link copied'}catch(e){msg.textContent=u}};
addEventListener('scroll',()=>mini.classList.toggle('on',scrollY>80),{passive:true});
</script></body></html>
