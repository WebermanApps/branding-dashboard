<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Deck Building · Branding Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-tokens.css">
<style>
*{box-sizing:border-box}html,body{background:#fff;color:#0a0a0a;margin:0}body{font:16px/1.55 Hind,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root{--t:#C1502E;--b:#05668D;--g:#0B6E4F;--s:#D4A017}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid #e5e5e5}.top{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.backhome{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border:2px solid #171717;color:#171717;text-decoration:none;font:700 15px/1 Khand,Hind,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.wm{font:700 22px/1 Khand,sans-serif;letter-spacing:.06em}
h1{font:700 48px/1 Khand,sans-serif;margin:24px 0 4px}.lead{color:#525252;margin:0 0 20px}
h2{font:700 26px/1.1 Khand,sans-serif;margin:28px 0 12px;display:flex;align-items:center;gap:10px}h2 .bar{width:6px;height:22px;background:var(--c)}
.bub{font:600 14px Hind;background:#f5f5f5;border-radius:999px;padding:2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;gap:12px;align-items:flex-start;border:1px solid #e5e5e5;border-left:4px solid var(--c);padding:14px;color:inherit;text-decoration:none;background:#fff;min-width:0}
.card .nm{font:700 20px/1.15 Khand,sans-serif}.card .sub{font-size:14px;color:#525252}.card .meta{font-size:13px;color:#737373;margin-top:4px}
.card .ic{width:22px;height:22px;flex:none;color:var(--c);margin-top:2px}.card>div{min-width:0;flex:1}
.tag{display:inline-block;font:700 12px Khand,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:1.5px solid var(--c);color:var(--c);margin-top:6px}
.empty{color:#737373;border:1px dashed #d4d4d4;padding:16px}
.mw-hover{transition:transform 180ms ease-out,box-shadow 180ms ease-out}.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.02);box-shadow:0 6px 18px rgba(10,10,10,.12)}
@media(hover:none){.mw-hover:hover{transform:none;box-shadow:none}}@media(prefers-reduced-motion:reduce){.mw-hover{transition:none}}
.sharerow{margin:36px 0 16px}.sharebtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border:2px solid #171717;background:#fff;color:#171717;font:700 16px Khand,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
footer{border-top:1px solid #e5e5e5;padding:18px 0;color:#737373;font-size:14px}
@media(max-width:480px){h1{font-size:38px}.grid{grid-template-columns:1fr}}
</style><script src="ptr.js?v=4" defer></script></head><body>
<header><div class="wrap top"><a class="backhome mw-hover" href="https://webermanapps.github.io/a-2sipntzsp385oxy3/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Apps Home</span></a><a class="wm" href="../" style="color:inherit;text-decoration:none">Branding Agent</a></div></header>
<main class="wrap">
<h1>Deck Building</h1><p class="lead">Every Style Swipe deck: waiting on you, finished, and requested by other agents.</p>
<h2 style="--c:var(--s)"><span class="bar"></span>Waiting On You <span class="bub" id="nWait">0</span></h2><div class="grid" id="wait"></div>
<h2 style="--c:var(--g)"><span class="bar"></span>Finished <span class="bub" id="nDone">0</span></h2><div class="grid" id="done"></div>
<h2 style="--c:var(--b)"><span class="bar"></span>Requests From Agents <span class="bub" id="nReq">0</span></h2><div class="grid" id="req"></div>
<div class="sharerow"><button class="sharebtn mw-hover" id="share" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>Share</button> <span id="msg" style="color:#525252;font-size:14px"></span></div>
</main>
<footer><div class="wrap"><b>Built by Max Weberman</b> · Branding Agent · Light Mode</div></footer>
<script>
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SELF='https://webermanapps.github.io/branding-djqmb410/decks/';
const link=id=>'https://webermanapps.github.io/style-swipe/?date='+encodeURIComponent(id)+'&from='+encodeURIComponent(SELF);
const IC={cards:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="12" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v13"/></svg>',
check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
inbox:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>'};
const date=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'Asia/Bangkok'});
fetch('../decks.json',{cache:'no-store'}).then(r=>r.json()).then(J=>{
 const W=J.decks.filter(d=>d.status==='wait').sort((a,b)=>a.order-b.order),F=J.decks.filter(d=>d.status==='done').sort((a,b)=>a.order-b.order);
 nWait.textContent=W.length;nDone.textContent=F.length;
 wait.innerHTML=W.map(d=>`<a class="card mw-hover" style="--c:var(--s)" href="${link(d.id)}">${IC.cards}<div><div class="nm">${esc(d.name)}</div><div class="sub">${esc(d.about)}</div><span class="tag">Waiting On You</span></div></a>`).join('')||'<div class="empty">Nothing waiting.</div>';
 done.innerHTML=F.map(d=>{const a=d.answered!=null?`${d.answered}/${d.total||50} answered`:'Answered count not recorded';
  return `<a class="card mw-hover" style="--c:var(--g)" href="${link(d.id)}">${IC.check}<div><div class="nm">${esc(d.name)}</div><div class="sub">${esc(d.about)}</div><div class="meta">${a}${d.via==='submit'?` · Sent with Submit ${date(d.submitted)}`:''}</div><span class="tag">Results In</span></div></a>`}).join('')||'<div class="empty">No finished decks yet.</div>';
}).catch(()=>{wait.innerHTML='<div class="empty">Decks not available.</div>'});
fetch('../requests.json',{cache:'no-store'}).then(r=>r.json()).then(J=>{const R=(J.requests||[]).filter(r=>r.status!=='Done');nReq.textContent=R.length;
 req.innerHTML=R.map(r=>`<${r.deck?`a href="${link(r.deck)}"`:'div'} class="card mw-hover" style="--c:var(--b)">${IC.inbox}<div><div class="nm">${esc(r.title)}</div><div class="sub">${esc(r.detail)}</div><div class="meta">From ${esc(r.from)} · Since ${esc(r.since)}</div><span class="tag">${esc(r.status)}</span></div></${r.deck?'a':'div'}>`).join('')||'<div class="empty">No open requests.</div>'}).catch(()=>{req.innerHTML='<div class="empty">No open requests.</div>'});
share.onclick=async()=>{const u=location.href.split('#')[0];try{if(navigator.share){await navigator.share({title:'Deck Building',url:u});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(u);msg.textContent='Link copied'}catch(e){msg.textContent=u}};
</script></body></html>
